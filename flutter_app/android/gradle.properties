org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The pub cache lives on C: while this project lives on F:. Kotlin's relocatable
# incremental caches relativize source paths against the project root, which
# throws "this and base files have different roots" for plugin sources and fails
# the build. Non-incremental compilation sidesteps the cross-drive path math.
kotlin.incremental=false
