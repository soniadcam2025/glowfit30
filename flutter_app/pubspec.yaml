name: glowfit
description: GlowFit - Fitness & Wellness Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Core UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  get: ^4.6.6

  # Networking
  dio: ^5.3.1

  # Local Storage
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.0.0

  # SVG Support
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0

  # Charts & Visualization
  fl_chart: ^0.64.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_messaging: ^16.3.0
  google_sign_in: ^7.2.0

  # Video Playback
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  flutter_blurhash: ^0.9.1
  connectivity_plus: 6.1.0

  # Offline downloads: a writable directory the OS will not sweep, and a stable
  # filename per url.
  path_provider: ^2.1.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    # Spoken cues for the "ready to go" countdown.
    - assets/audio/

