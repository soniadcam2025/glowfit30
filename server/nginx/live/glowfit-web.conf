# Landing page — glowfit30.com (static build served from disk)
# Managed alongside: api (api.glowfit30.com), admin (admin.glowfit30.com)
server {
    server_name glowfit30.com www.glowfit30.com;

    root /var/www/glowfit/web/current;
    index index.html;

    # SPA fallback — unknown paths return index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entrypoint, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/glowfit30.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/glowfit30.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.glowfit30.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = glowfit30.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name glowfit30.com www.glowfit30.com;
    return 404; # managed by Certbot




}